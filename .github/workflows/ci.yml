name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-browser-failures
          path: frontend/test-results/
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hireme
          POSTGRES_PASSWORD: hireme
          POSTGRES_DB: hireme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hireme -d hireme"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/hireme_ai
      - run: uv run pytest
      - run: node --test tests/web/*.test.mjs
      - run: uv run python evaluation/run_evaluation.py
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run python scripts/check_live_storage.py
      - run: uv run python scripts/check_public_storage.py
