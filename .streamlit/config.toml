[theme]
base = "light"
primaryColor = "#087F72"
backgroundColor = "#F5F7F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#152B36"
font = "sans serif"

[server]
headless = true
maxUploadSize = 5
maxMessageSize = 10

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false
