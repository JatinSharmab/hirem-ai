[project]
name = "hireme-ai"
version = "0.1.0"
description = "Evidence-grounded agentic career intelligence and application engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "httpx>=0.27",
  "streamlit>=1.38",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "PyMuPDF>=1.24",
  "python-docx>=1.1",
  "reportlab>=4.2",
  "structlog>=24.4",
  "tenacity>=9.0",
  "langgraph>=0.2",
  "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
extend-exclude = [".tools", "frontend/node_modules", "frontend/.next"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
packages = ["hireme_ai"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hireme_ai"]
